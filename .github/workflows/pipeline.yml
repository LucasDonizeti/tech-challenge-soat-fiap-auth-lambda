name: CI/CD Pipeline - Auth Lambda

on:
  push:
    branches: [ "develop" ]
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "develop" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: auth-lambda
  TERRAFORM_DIR: ./terraform
  LAMBDA_DIR: ./lambda-authorizer

jobs:
  # JOB 1 — Build + Testes
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B verify --file pom.xml
        working-directory: ${{ env.LAMBDA_DIR }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: lambda-authorizer/target/*.jar
          retention-days: 1

  # JOB 2 — Build e push da imagem Docker para o ECR
  push-image-ecr:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: lambda-authorizer/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tag da imagem
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Tag da imagem: ${SHORT_SHA}"

      - name: Build e push da imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -f ./lambda-authorizer/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./lambda-authorizer
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # JOB 3 — Deploy com Terraform da Lambda
  deploy:
    name: Deploy Terraform → AWS Lambda
    runs-on: ubuntu-latest
    needs: [ push-image-ecr ]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 'latest'

      - name: Buscar Account ID
        id: account-info
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Buscar Endpoint do RDS
        id: rds-info
        run: |
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier oficina-rds \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Buscar senha do RDS no Secrets Manager
        id: rds-secret
        run: |
          SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier oficina-rds \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query 'SecretString' \
            --output text | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")
          echo "::add-mask::$DB_PASSWORD"
          echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT

      - name: Terraform Init
        env:
          ECR_REGISTRY: ${{ needs.push-image-ecr.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.push-image-ecr.outputs.image_tag }}
          RDS_ENDPOINT: ${{ steps.rds-info.outputs.rds_endpoint }}
          DB_PASSWORD: ${{ steps.rds-secret.outputs.db_password }}
          ACCOUNT_ID: ${{ steps.account-info.outputs.account_id }}
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform init

      - name: Terraform Plan
        env:
          ECR_REGISTRY: ${{ needs.push-image-ecr.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.push-image-ecr.outputs.image_tag }}
          RDS_ENDPOINT: ${{ steps.rds-info.outputs.rds_endpoint }}
          DB_PASSWORD: ${{ steps.rds-secret.outputs.db_password }}
          ACCOUNT_ID: ${{ steps.account-info.outputs.account_id }}
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform plan \
            -var="account_id=$ACCOUNT_ID" \
            -var="db_url=jdbc:mysql://${RDS_ENDPOINT}:3306/oficina" \
            -var="db_user=${{ secrets.DB_USERNAME }}" \
            -var="db_password=$DB_PASSWORD" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="image_tag=$IMAGE_TAG" \
            -var="subnet_ids=[]" \
            -var="security_group_ids=[]"

      - name: Terraform Apply
        env:
          ECR_REGISTRY: ${{ needs.push-image-ecr.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.push-image-ecr.outputs.image_tag }}
          RDS_ENDPOINT: ${{ steps.rds-info.outputs.rds_endpoint }}
          DB_PASSWORD: ${{ steps.rds-secret.outputs.db_password }}
          ACCOUNT_ID: ${{ steps.account-info.outputs.account_id }}
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform apply -auto-approve \
            -var="account_id=$ACCOUNT_ID" \
            -var="db_url=jdbc:mysql://${RDS_ENDPOINT}:3306/oficina" \
            -var="db_user=${{ secrets.DB_USERNAME }}" \
            -var="db_password=$DB_PASSWORD" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="image_tag=$IMAGE_TAG" \
            -var="subnet_ids=[]" \
            -var="security_group_ids=[]"

      - name: Verificar status da Lambda
        run: |
          LAMBDA_STATUS=$(aws lambda get-function \
            --function-name oficina-auth-lambda \
            --query 'Configuration.State' \
            --output text)
          echo "Status da Lambda: $LAMBDA_STATUS"
          if [ "$LAMBDA_STATUS" != "Active" ]; then
            echo "Lambda não está ativa"
            exit 1
          fi
